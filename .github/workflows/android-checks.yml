name: Android checks

on:
  push:
    branches: ["codex/batch-teaching-evaluation"]
  pull_request:
    paths: ["kcb-app/**", ".github/workflows/android-checks.yml"]
  workflow_dispatch:

concurrency:
  group: android-checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Use official Maven repositories
        run: |
          cat > "$RUNNER_TEMP/ci-repos.gradle" <<'INIT'
          settingsEvaluated { settings ->
            settings.pluginManagement.repositories.clear()
            settings.pluginManagement.repositories { google(); mavenCentral(); gradlePluginPortal() }
            settings.dependencyResolutionManagement.repositories.clear()
            settings.dependencyResolutionManagement.repositories { google(); mavenCentral() }
          }
          INIT
      - name: Unit tests, debug build and lint
        working-directory: kcb-app
        run: ./gradlew -I "$RUNNER_TEMP/ci-repos.gradle" :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-results
          path: |
            kcb-app/app/build/reports/tests/
            kcb-app/app/build/reports/lint-results-debug.*
            kcb-app/app/build/outputs/apk/debug/*.apk
